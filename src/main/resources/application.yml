server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /smart-basket/api/v1

spring:
  application:
    name: smart-basket-backend
  data:
    mongodb:
      # MongoDB URI from environment variable (required in production)
      # Example: mongodb+srv://user:password@cluster.mongodb.net/database?retryWrites=true&w=majority
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartbasket}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: ${LOG_LEVEL_MONGODB:INFO}
    root: ${LOG_LEVEL_ROOT:INFO}
